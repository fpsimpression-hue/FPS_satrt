services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fastprint}
      POSTGRES_USER: ${POSTGRES_USER:-fastprint}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ./apps/api
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-fastprint}:${POSTGRES_PASSWORD:-local-development-only}@db:5432/${POSTGRES_DB:-fastprint}
      CORS_ORIGINS: '${CORS_ORIGINS:-["http://localhost:3000","http://localhost:3001"]}'
      FILE_STORAGE_PATH: /var/lib/fastprint/uploads
      PRODUCT_IMAGE_STORAGE_PATH: /var/lib/fastprint/product-images
      MAX_UPLOAD_SIZE_BYTES: ${MAX_UPLOAD_SIZE_BYTES:-26214400}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?Copy .env.example to .env and set the admin password hash}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:?Copy .env.example to .env and set the admin session secret}
      ADMIN_COOKIE_SECURE: ${ADMIN_COOKIE_SECURE:-false}
    volumes:
      - uploaded_files:/var/lib/fastprint/uploads
      - product_images:/var/lib/fastprint/product-images
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  notification-worker:
    build:
      context: ./apps/api
    command: ["python", "-m", "app.notification_worker"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-fastprint}:${POSTGRES_PASSWORD:-local-development-only}@db:5432/${POSTGRES_DB:-fastprint}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_API_VERSION: ${WHATSAPP_API_VERSION:-}
      WHATSAPP_TEMPLATE_FR: ${WHATSAPP_TEMPLATE_FR:-}
      WHATSAPP_TEMPLATE_AR: ${WHATSAPP_TEMPLATE_AR:-}
      WHATSAPP_TEMPLATE_EN: ${WHATSAPP_TEMPLATE_EN:-}
      WHATSAPP_MAX_ATTEMPTS: ${WHATSAPP_MAX_ATTEMPTS:-8}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  uploaded_files:
  product_images:
